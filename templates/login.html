<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NittanyAuction Login</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          crossorigin="anonymous">
    <style>
        body {
            background-color: #f2f2f2;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 420px;
            background: white;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 30px;
        }

        .brand-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .brand-title .nittany {
            color: #1e4fa1;
        }

        .brand-title .auction {
            color: #28a745;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .btn-login {
            width: 100%;
            font-weight: 600;
        }

        .bottom-links {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="brand-title">
            <span class="nittany">Nittany</span><span class="auction">Auction</span>
        </div>
        <p class="subtitle">Sign in as Bidder, Seller, or HelpDesk</p>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Enter your password" required>
            </div>

            {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary btn-login">Sign In</button>

            <div class="text-center mt-3">
                <p class="mb-1">New to NittanyAuction?</p>
                <a href="/register" class="btn btn-outline-success btn-block">
                    Create Account
                </a>
            </div>

            <div class="bottom-links">
                <a href="/">Go Back</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
