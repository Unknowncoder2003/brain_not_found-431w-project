<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
          overflow: hidden;
          background-color: #333;
        }

        .navbar a {
          float: left;
          font-size: 16px;
          color: white;
          text-align: center;
          padding: 14px 16px;
          text-decoration: none;
        }

        .dropdown {
          float: left;
          overflow: hidden;
        }

        .dropdown .dropbtn {
          font-size: 16px;
          border: none;
          outline: none;
          color: white;
          padding: 14px 16px;
          background-color: inherit;
          font-family: inherit;
          margin: 0;
        }

        .navbar a:hover, .dropdown:hover .dropbtn {
          background-color: red;
        }

        .dropdown-content {
          display: none;
          position: absolute;
          background-color: #f9f9f9;
          min-width: 160px;
          box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
          z-index: 1;
        }

        .dropdown-content a {
          float: none;
          color: black;
          padding: 12px 16px;
          text-decoration: none;
          display: block;
          text-align: left;
        }

        .dropdown-content a:hover {
          background-color: #ddd;
        }

        .dropdown:hover .dropdown-content {
          display: block;
        }

        .brand-title {
            text-align: right;
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .brand-title .nittany {
            color: #1e4fa1;
        }

        .brand-title .auction {
            color: #28a745;
        }
    </style>
</head>
<body>
    <header style="display: flex; align-items: center;">
        <h1>Hi............</h1>
        <div class="brand-title" style="margin-left: auto;">
            <span class="nittany">Nittany</span><span class="auction">Auction</span>
        </div>
    </header>
    <div class="navbar">
    <a href="/">Home</a>
    <a href="/">Items</a>
    <div class="dropdown">
    <button class="dropbtn">Dropdown
      <i class="fa fa-caret-down"></i>
    </button>
    <div class="dropdown-content">
      <a href="#">Current bids</a>
      <a href="#">Watch list</a>
      <a href="#">Past bids</a>
    </div>
    </div>
        <a href="/login">Logout</a>
    </div>

<div>
    <div>
        <p class="subtitle">You are a bidder, go buy some stuff</p>
        <form action="/bidder" method="POST">
        </form>
    </div>

</div>
    <p>items: </p>
    <figure>
    <img src="https://m.media-amazon.com/images/I/81gwsl+v-fL.jpg"  width= "400" height = "300">
    <figcaption>Toy Train.</figcaption>
    </figure>



</body>
</html>
