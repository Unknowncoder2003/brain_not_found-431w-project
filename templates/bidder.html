<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bidder page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          crossorigin="anonymous">
    <style>

    body { background-color: #f2f2f2; }

    .navbar {
            background-color: white;
            border-bottom: 2px solid #1e4fa1;
            margin-bottom: 30px;
        }

    .brand-text .nittany { color: #1e4fa1; font-weight: bold; }
    .brand-text .auction { color: #28a745; font-weight: bold; }

        .dashboard-card {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 2rem;
        }

    .welcome-header {
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
        <a class="navbar-brand brand-text" href="/bidder">
            <span class="nittany">Nittany</span><span class="auction">Auction</span>
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#sellerNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="sellerNavbar">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="/bidder">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/my-listings">My Listings</a>
                </li>
                <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="exampleDropdown"
                   role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Bidder Tools
                </a>
                <div class="dropdown-menu" aria-labelledby="exampleDropdown">
                    <a class="dropdown-item" href="/past">Past Bids</a>
                    <a class="dropdown-item" href="/current">Current Bids</a>
                    <a class="dropdown-item" href="/watchlist">Watch list</a>
                    <div class="dropdown-divider"></div>
                    <a class="dropdown-item" href="/support">Contact HelpDesk</a>
                </div>
                </li>
            </ul>

            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <span class="nav-link text-muted">Bidder: <strong>{{ first_name }}</strong></span>
                </li>
                <li class="nav-item">
                    <a class="btn btn-sm btn-outline-danger ml-2" href="/login">Logout</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10 dashboard-card">
            <h2 class="welcome-header">Hi, {{ first_name }}!</h2>

            <p class="lead">Welcome to your Bidder dashboard. Go buy some stuff</p>

        </div>
    </div>
</div>
    <p>Items: </p>
    <figure>
    <img src="https://m.media-amazon.com/images/I/81gwsl+v-fL.jpg"  width= "400" height = "300">
    <figcaption>Toy Train.</figcaption>
    </figure>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

</body>
</html>
