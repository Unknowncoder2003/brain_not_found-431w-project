<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request New Category | NittanyAuction</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          crossorigin="anonymous">
    <style>
        body { background-color: #f2f2f2; }
        .navbar {
            background-color: white;
            border-bottom: 2px solid #1e4fa1;
            margin-bottom: 30px;
        }
        .brand-text .nittany { color: #1e4fa1; font-weight: bold; }
        .brand-text .auction { color: #28a745; font-weight: bold; }
        .dashboard-card {
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 2rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
        <a class="navbar-brand brand-text" href="/">
            <span class="nittany">Nittany</span><span class="auction">Auction</span>
        </a>
        <div class="ml-auto">
            <a class="btn btn-sm btn-outline-danger" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 dashboard-card">
            <h2 class="mb-4">Request a New Category</h2>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            {% if success %}
                <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            <form method="POST" action="/request/add-category">
                <div class="form-group">
                    <label>New Category Name</label>
                    <input type="text" class="form-control" name="category_name" required>
                </div>

                <div class="form-group">
                  <label>Parent Category</label>
                  <input type="text"
                         class="form-control"
                         name="parent_category"
                         placeholder="Enter the parent category name"
                         required>
                </div>

                <div class="form-group">
                    <label>Reason / Notes</label>
                    <textarea class="form-control" name="reason" rows="4"
                              placeholder="Explain why this category should be added"></textarea>
                </div>

                <button type="submit" class="btn btn-success">Submit Request</button>
                <a href="/bidder" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
